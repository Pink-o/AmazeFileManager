name: Build and Release APK

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v3.11.2
  workflow_dispatch:  # Manual trigger
    inputs:
      release_name:
        description: 'Release name (e.g., v3.11.2-tracker-free)'
        required: true
        default: 'v3.11.2-tracker-free'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;28.0.12916984" || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Add Rust Android targets
        run: |
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update NDK version for CI
        run: |
          sed -i 's/ndk = "28.2.13676358"/ndk = "28.0.12916984"/' gradle/libs.versions.toml

      - name: Build Release APK
        run: ./gradlew assembleFdroidRelease --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.12916984

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -storepass android -alias release -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AmazeFileManager, OU=Release, O=Pink-o, L=GitHub, ST=Open Source, C=US"

      - name: Sign APK
        run: |
          # Align
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v -p 4 \
            app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk \
            app/build/outputs/apk/fdroid/release/app-fdroid-release-aligned.apk
          
          # Sign
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/fdroid/release/AmazeFileManager-fdroid-release.apk \
            app/build/outputs/apk/fdroid/release/app-fdroid-release-aligned.apk

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose \
            app/build/outputs/apk/fdroid/release/AmazeFileManager-fdroid-release.apk

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazeFileManager-fdroid-release
          path: app/build/outputs/apk/fdroid/release/AmazeFileManager-fdroid-release.apk

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          body: |
            ## AmazeFileManager - Tracker Free Build
            
            This is a privacy-focused build with the following modifications:
            - ✅ ACRA crash reporting removed
            - ✅ No analytics or tracking
            - ✅ F-Droid flavor (no Google Play dependencies)
            
            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" if needed
            3. Install the APK
            
            ### Build Info
            - Version: ${{ steps.version.outputs.version }}
            - Build: fdroid-release
            - Signed: Yes (debug key)
            
            ### Checksums
            ```
            SHA256: $(sha256sum app/build/outputs/apk/fdroid/release/AmazeFileManager-fdroid-release.apk | cut -d' ' -f1)
            ```
          files: |
            app/build/outputs/apk/fdroid/release/AmazeFileManager-fdroid-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

