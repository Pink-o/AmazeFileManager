name: Sync Fork with Upstream

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.upstream_commits > 0 }}
    
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: release/4.0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/TeamAmaze/AmazeFileManager.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_COMMITS=$(git rev-list HEAD..upstream/release/4.0 --count)
          echo "upstream_commits=$UPSTREAM_COMMITS" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            echo "Found $UPSTREAM_COMMITS new commits from upstream"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Fork is up to date with upstream"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.upstream_commits > 0
        run: |
          git merge upstream/release/4.0 -m "Merge upstream changes [skip ci]" --allow-unrelated-histories || {
            echo "Merge conflict detected! Manual intervention required."
            exit 1
          }

      - name: Push changes
        if: steps.check.outputs.upstream_commits > 0
        run: |
          git push origin release/4.0

      - name: Trigger build workflow
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-release.yml',
              ref: 'release/4.0',
              inputs: {
                release_name: `sync-${today}`
              }
            });
            console.log('Triggered build-release.yml workflow');
